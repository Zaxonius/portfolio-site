<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Keyte Hipkins Photography</title>
  <link rel="icon" type="image/svg+xml" href="/images/khfavicon.svg?v=1">
  <style>html,body{background:#000;color:#fff}button{background:#fff;color:#000}</style>
  <link rel="stylesheet" href="admin.css?v=6">
  <script src="config.js?v=6" defer></script>
  <script src="admin.js?v=6" type="module"></script>
</head>
<body>
  <header><a href="index.html">Back to website</a><button id="logout" hidden>Sign out</button></header>
  <main>
    <h1>Admin</h1>
    <section id="loginBox" class="login">
      <form id="loginForm"><label for="passwordInput">Password</label><input type="password" id="passwordInput" autocomplete="current-password" required maxlength="256"><button id="loginButton" type="submit">Sign in</button></form>
      <p id="loginStatus" role="status" aria-live="polite"></p>
    </section>
    <div id="adminPanel" hidden>
<section class="upload">
        <h2 id="uploadTitle">Upload photo</h2>
        <form id="uploadForm">
          <label for="fileInput" id="fileLabel">Photo</label><input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" required>
          <img id="preview" alt="Selected photo" hidden>
          <label for="description">Caption (optional)</label><textarea id="description" rows="2" maxlength="500"></textarea>

          <button id="uploadButton" type="submit">Upload</button><p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="library">
        <div class="heading"><h2>Photos</h2><button id="refresh">Refresh</button></div>
        <div class="library-tools"><label for="search">Search<input id="search" type="search" placeholder="Search captions"></label></div>
        <p id="photoCount"></p><p id="libraryStatus" role="status" aria-live="polite"></p><div id="photoGrid" class="photo-grid"></div>
      </section>
    </div>
  </main>
  <dialog id="editDialog"><form id="editForm"><div class="heading"><h2>Edit photo</h2><button type="button" id="closeEdit">Close</button></div><img id="editPreview" alt="Photo being edited"><label for="editDescription">Caption</label><textarea id="editDescription" rows="2" maxlength="500"></textarea><p id="editStatus" role="status"></p><button id="saveEdit" type="submit">Save</button></form></dialog>
  <dialog id="deleteDialog"><h2>Remove photo?</h2><p>This photo will be removed from your website.</p><p id="deleteStatus" role="status"></p><div class="dialog-actions"><button id="cancelDelete">Cancel</button><button id="confirmDelete">Remove</button></div></dialog>
</body>
</html>
