<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keyte Hipkins Photography</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon.png">

    <link rel="shortcut icon" href="./images/favicon.png">

    <link rel="apple-touch-icon" href="./images/favicon.png">

    <link rel="stylesheet" href="style.css">
</head>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<script>
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => {
                    document.location.href = "/admin/";
                });
            }
        });
    }
</script>

<body>

    <!-- HERO -->

    <section class="hero">

        <img src="images/signature.png" class="hero-logo">

    </section>

    <!-- CATEGORY GRID -->

    <section class="category-grid">

        <a href="gallery.html?category=wildlife" class="category-card transition-link">
            <img src="images/wildlife.jpg">
            <div class="overlay">
                <h2>Wildlife and Animals</h2>
            </div>
        </a>

        <a href="gallery.html?category=sport" class="category-card transition-link">
            <img src="images/sport.jpg">
            <div class="overlay">
                <h2>Sport</h2>
            </div>
        </a>

        <a href="gallery.html?category=motorsport" class="category-card transition-link">
            <img src="images/motorsport.jpg">
            <div class="overlay">
                <h2>Motorsport</h2>
            </div>
        </a>

        <a href="gallery.html?category=other" class="category-card transition-link">
            <img src="images/other.jpg">
            <div class="overlay">
                <h2>Other Photos</h2>
            </div>
        </a>

    </section>

    <!-- CONTACT -->

    <footer class="contact">

        <h2>Contact / Social Media</h2>

        <div class="contact-links">

            <a href="mailto:keytehipkins@gmail.com">
                Email
            </a>

            <a href="https://instagram.com/keytehipkins" target="_blank">
                Instagram
            </a>

            <a href="https://youtube.com/@zaxtechnology" target="_blank">
                YouTube
            </a>

        </div>

    </footer>

    <script src="script.js"></script>

</body>

</html>
