backend:
  name: git-gateway
  repo: Zaxonius/portfolio-site
  branch: main

publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "Gallery"

    folder: "content/gallery"
    create: true

    slug: "{{slug}}"

    fields:
      - label: "Image"
        name: "image"
        widget: "image"

      - label: "Caption"
        name: "caption"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "select"

        options:
          - wildlife
          - sport
          - motorsport
          - other