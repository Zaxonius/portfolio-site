backend:
  name: github
  repo: Zaxonius/portfolio-site
  branch: main
  auth_scope: repo
  app_id: Ov23liSJk29J9MD2wLIS

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "Gallery Images"

    files:

      - label: "Gallery"
        name: "gallery"
        file: "gallery.json"

        fields:

          - label: "Images"
            name: "images"
            widget: "list"

            fields:

              - label: "Image"
                name: "image"
                widget: "image"

              - label: "Caption"
                name: "caption"
                widget: "string"

              - label: "Category"
                name: "category"
                widget: "select"

                options:
                  - wildlife
                  - sport
                  - motorsport
                  - other